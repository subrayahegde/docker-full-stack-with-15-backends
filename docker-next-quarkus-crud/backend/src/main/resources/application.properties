
quarkus.http.port=${PORT:5000}
quarkus.http.host=0.0.0.0

# CORS
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${CORS_ORIGIN:http://localhost:3000}
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=Accept,Authorization,Content-Type,X-Requested-With

# Datasource
quarkus.datasource.db-kind=postgresql
quarkus.datasource.db-version=17
quarkus.datasource.jdbc.url=${QUARKUS_DATASOURCE_JDBC_URL:jdbc:postgresql://database:5432/clidb?sslmode=disable}
quarkus.datasource.username=${DB_USER:postgres}
quarkus.datasource.password=${DB_PASSWORD:Pass123}

# Hibernate ORM (uses table created by init.sql)
quarkus.hibernate-orm.schema-management.strategy=validate

# Health endpoint path
quarkus.smallrye-health.root-path=/health
