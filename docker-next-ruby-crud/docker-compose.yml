services:
  database:
    image: postgres:17-alpine
    container_name: crud-postgres-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Pass123
      POSTGRES_DB: clidb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    # --- ADD THIS HEALTHCHECK BLOCK ---
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d clidb"]
      interval: 3s
      timeout: 3s
      retries: 5
    networks:
      - app-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: crud-rails-backend
 #   entrypoint: ['/bin/sh', '-c', 'rm -f tmp/pids/server.pid && exec "$@"', '--']
 #   command: ['bundle', 'exec', 'rails', 'server', '-b', '0.0.0.0', '-p', '5000']
 #   command: bundle exec rails server -b 0.0.0.0 -p 5000
 #   command: ["/bin/sh", "-c", "rm -f tmp/pids/server.pid && bundle exec rackup config.ru -b 0.0.0.0 -p 5000"]
 #   command: ["/bin/sh", "-c", "rm -f tmp/pids/server.pid && bundle exec puma -b tcp://0.0.0.0:5000 config.ru"]
 #   command: ["/bin/sh", "-c", "mkdir -p tmp/pids && rm -f tmp/pids/server.pid && bundle exec puma -b tcp://0.0.0.0:5000 config.ru"]

    environment:
      - DATABASE_URL=postgresql://postgres:Pass123@database:5432/clidb
      - RAILS_ENV=development
      - PORT=5000
      - BUNDLE_PATH=/gems
      - BUNDLE_BIN=/gems/bin
      - PATH=/gems/bin:$PATH
      - BUNDLE_WITHOUT=production
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
    depends_on:
      database:
        condition: service_healthy
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: crud-nextjs-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - app-network

volumes:
  pgdata:

networks:
  app-network:
    driver: bridge

